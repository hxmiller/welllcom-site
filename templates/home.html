{% extends "base.html" %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-lg-9 col-xl-8">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="h4 fw-semibold mb-3">{{ heading }}</h2>

          <div class="wc-prose">
            {% for para in paragraphs %}
              {% if para.strip() %}
                <p>{{ para }}</p>
              {% endif %}
            {% endfor %}

            {% if bullets %}
              <ul class="mt-3">
                {% for b in bullets %}
                  <li>{{ b }}</li>
                {% endfor %}
              </ul>
            {% endif %}
          </div>

          <!-- Page view counter -->
          <div class="text-center mt-4">
            <small class="text-muted">Page views:</small><br>
            <img
              src="https://hitcount.app/get.php?url=https://wellcom.fit/{{ active_page }}"
              alt="Page view counter"
            >
          </div>

        </div>
      </div>
    </div>
  </div>
{% endblock %}
