{% extends "base.html" %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-lg-9 col-xl-8">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="h4 fw-semibold mb-3">{{ heading }}</h2>

          <div class="wc-prose">
            {% for para in paragraphs %}
              {% if para.strip() %}
                <p>{{ para }}</p>
              {% endif %}
            {% endfor %}
          </div>

          <div class="mt-3">
            <a class="btn btn-primary" href="{{ url_for('login') }}">Login</a>
          </div>
        </div>
      </div>

      <div class="small text-muted mt-3 text-center">
        WellCom is not an emergency service. For emergencies, call 911.
      </div>
    </div>
  </div>
{% endblock %}
